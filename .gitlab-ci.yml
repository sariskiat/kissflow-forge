# Gitlab Variables on Repository
# APPLICATION_TEAM: ai

default:
  tags:
    - cjexpress-internal

workflow:
  name: 'Deploy: $ENVIRONMENT | tag=$DEPLOY_TAG'
  rules:
    - if: '$CUSTOM_IMAGE_TAG != ""'
      variables:
        DEPLOY_TAG: "$CUSTOM_IMAGE_TAG"
    - when: always
      variables:
        DEPLOY_TAG: "$CI_COMMIT_SHORT_SHA"

variables:
  SERVICE_NAME: "kissflow-mcp"
  GITOPS_REPO: "mcp/kissflow-mcp"
  ENVIRONMENT:
    value: "dev"
    description: "Environment to deploy to"
    options:
      - "dev"
      - "prod"
  CUSTOM_IMAGE_TAG:
    value: ""
    description: "Image tag to deploy, e.g. abc1234ef"

include:
  - project: cjexpress/tildi/infra/sre/gitlab-ci-modules
    ref: main
    file:
      - sonarqube/scanner.yml
      - ci-templates/gcp-auth.yml
      - ci-templates/sre-build-and-push.yml
      - ci-templates/sre-retag-and-push-prod.yml
      - ci-templates/sre-deploy-update-helm-image-tag.yml

stages:
  - quality-gate
  - build-and-push
  - prod-retag-and-push
  - update-on-image-tag-helm

.dev-build-service:
  extends:
    - .build-docker
    - .gcp-auth
  stage: build-and-push
  variables:
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.dev-update-gitops:
  extends: .update-image-tag-helm
  stage: update-on-image-tag-helm
  variables:
    ENVIRONMENT: dev
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.prod-retag-service:
  extends:
    - .retag-and-push-prod
    - .gcp-auth
  stage: prod-retag-and-push

.prod-update-gitops:
  extends: .update-image-tag-helm
  stage: update-on-image-tag-helm
  variables:
    ENVIRONMENT: prod
    IMAGE_TAG: "$CUSTOM_IMAGE_TAG"

sonar-scan-dev:
  extends: .sonar-scanner
  stage: quality-gate
  allow_failure: true
  variables:
    PROJECT_ID: ${CI_PROJECT_NAME}
    SONAR_WAIT_GATE: "false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

build-dev:
  extends: .dev-build-service
  variables:
    DOCKER_BUILD_ARGS: ""
    DOCKER_BUILD_CONTEXT: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

update-gitops-dev:
  extends: .dev-update-gitops
  needs:
    - job: build-dev
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

build-dev-manual:
  extends: .dev-build-service
  variables:
    DOCKER_BUILD_ARGS: ""
    DOCKER_BUILD_CONTEXT: ""
    IMAGE_TAG: "$CUSTOM_IMAGE_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $ENVIRONMENT == "dev" && $CUSTOM_IMAGE_TAG != ""'
      when: manual
      allow_failure: true

update-gitops-dev-manual:
  extends: .dev-update-gitops
  needs:
    - job: build-dev-manual
      artifacts: false
  variables:
    IMAGE_TAG: "$CUSTOM_IMAGE_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $ENVIRONMENT == "dev" && $CUSTOM_IMAGE_TAG != ""'

retag-prod:
  extends: .prod-retag-service
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $ENVIRONMENT == "prod" && $CUSTOM_IMAGE_TAG != ""'
      when: manual
      allow_failure: true

update-gitops-prod:
  extends: .prod-update-gitops
  needs:
    - job: retag-prod
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $ENVIRONMENT == "prod" && $CUSTOM_IMAGE_TAG != ""'
