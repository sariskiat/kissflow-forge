# Gitlab Variables on Repository
# APPLICATION_TEAM: ai

default:
  tags:
    - cjexpress-internal

variables:
  SERVICE_NAME: "kissflow-mcp"
  GITOPS_REPO: "mcp/kissflow-mcp"

include:
  - project: cjexpress/tildi/infra/sre/gitlab-ci-modules
    ref: main
    file:
      - sonarqube/scanner.yml
      - ci-templates/gcp-auth.yml
      - ci-templates/sre-build-and-push.yml
      - ci-templates/sre-retag-and-push-prod.yml
      - ci-templates/sre-deploy-update-helm-image-tag.yml

stages:
  - quality-gate
  - build-and-push
  - update-on-image-tag-helm
  - prod-retag-and-push
  - update-on-image-tag-helm-prod

.dev-build-service:
  extends:
    - .build-docker
    - .gcp-auth
  stage: build-and-push
  variables:
    IMAGE_TAG: "dev-$CI_COMMIT_SHORT_SHA"

.dev-update-gitops:
  extends: .update-image-tag-helm
  stage: update-on-image-tag-helm
  variables:
    ENVIRONMENT: dev
    IMAGE_TAG: "dev-$CI_COMMIT_SHORT_SHA"

.prod-retag-service:
  extends:
    - .retag-and-push-prod
    - .gcp-auth
  stage: prod-retag-and-push

.prod-update-gitops:
  extends: .update-image-tag-helm
  stage: update-on-image-tag-helm-prod
  variables:
    ENVIRONMENT: prod
    IMAGE_TAG: "dev-$CI_COMMIT_SHORT_SHA"

# Runs on every branch, not just main: the architecture contracts and the 2270-test suite are
# only useful if they gate the change that breaks them, not the merge after it.
lint:
  stage: quality-gate
  image: python:3.13-slim
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run lint-imports          # Clean Architecture layer contracts
    - uv run ty check .

test:
  stage: quality-gate
  image: python:3.13-slim
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    - uv run pytest --cov=src/app --cov-report=term-missing

sonar-scan-dev:
  extends: .sonar-scanner
  stage: quality-gate
  allow_failure: true
  variables:
    PROJECT_ID: ${CI_PROJECT_NAME}
    SONAR_WAIT_GATE: "false"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

build-dev:
  extends: .dev-build-service
  variables:
    DOCKER_BUILD_ARGS: ""
    DOCKER_BUILD_CONTEXT: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

update-gitops-dev:
  extends: .dev-update-gitops
  needs:
    - job: build-dev
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

retag-prod:
  extends: .prod-retag-service
  needs:
    - job: update-gitops-dev
      artifacts: false
  variables:
    SOURCE_IMAGE_TAG: "dev-$CI_COMMIT_SHORT_SHA"
    TARGET_IMAGE_TAG: "dev-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
      when: manual
      allow_failure: true

update-gitops-prod:
  extends: .prod-update-gitops
  needs:
    - job: retag-prod
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'
